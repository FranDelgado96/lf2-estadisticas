<script>
const TEAMS = {
  A:["Aceites Abril ADBA Sanfer","CB Isla Bonita Sano Sano Catering","CB Las Rozas","CB Pozuelo","Cesur Distrito Olímpico","DPES-Sumialki CB Ciudad de Móstoles","El Cochinillo Segoviano","Grupo Interbus Alcobendas","Hierros Díaz Extremadura Miralvalle","Magec Tías Lanzarote CLVDG","Mariscos Antón Cortegada","Sernova Renovables Real Canoe","Siroko Gijón Basketball","SPAR Gran Canaria"],
  B:["Baloncesto Claret Benimaclet","Basket Almeda","Dishelec 65 Viladecans","GEiEG Pacisa","Horbisa Spirit Ausarta Barakaldo","Ibaizabal","Lucentum Alicante","Manresa CBF","Romakuruma UE Mataró","Segle XXI","Smartlog Ointxe","Stadium Casablanca","TGN Bàsquet","Xerez Club Deportivo"]
};
const TEAM_ID = {"CB Pozuelo": 1008863, "Ibaizabal": 1008861, "TGN Bàsquet": 1008923, "Lucentum Alicante": 1008684, "Mariscos Antón Cortegada": 1008974, "CB Las Rozas": 1009132, "Smartlog Ointxe": 1008896, "Cesur Distrito Olímpico": 1008994, "Manresa CBF": 1008862, "Horbisa Spirit Ausarta Barakaldo": 1008415, "Xerez Club Deportivo": 1009104, "El Cochinillo Segoviano": 1008644, "Siroko Gijón Basketball": 1008805, "GEiEG Pacisa": 1008849, "Magec Tías Lanzarote CLVDG": 1008709, "Hierros Díaz Extremadura Miralvalle": 1008973, "Basket Almeda": 1008887, "Aceites Abril ADBA Sanfer": 1008791, "Grupo Interbus Alcobendas": 1008995, "DPES-Sumialki CB Ciudad de Móstoles": 1008893, "Segle XXI": 1008892, "Baloncesto Claret Benimaclet": 1008939, "SPAR Gran Canaria": 1008710, "Stadium Casablanca": 1009096, "Sernova Renovables Real Canoe": 1008864, "CB Isla Bonita Sano Sano Catering": 1008779, "Dishelec 65 Viladecans": 1008938, "Romakuruma UE Mataró": 1008949};
const crestInit=t=>String(t).split(/\s+/).filter(w=>/^[A-ZÁÉÍÓÚÑ]/.test(w)&&!/^(CB|CD|UE|CBF|SL)$/.test(w)).slice(0,2).map(w=>w[0]).join("")||String(t)[0];
function crest(t,sz=22){const id=TEAM_ID[t];const ini=`<span class="crest ini" style="width:${sz}px;height:${sz}px;font-size:${Math.round(sz*.42)}px" aria-hidden="true">${esc(crestInit(t))}</span>`;return id?`<img class="crest" src="https://imagenes.feb.es/Imagen.aspx?i=${id}&ti=1" width="${sz}" height="${sz}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.outerHTML=this.dataset.f" data-f='${ini.replace(/'/g,"&#39;")}'>`:ini}
const GROUP_OF = {}; for (const g in TEAMS) TEAMS[g].forEach(t=>GROUP_OF[t]=g);
const ALL_TEAMS = [...TEAMS.A,...TEAMS.B];
const FIELDS = ["min","t2m","t2a","t3m","t3a","tlm","tla","ro","rd","ast","rob","tap","per","fc","fr"];

let db=null, canWrite=false, players=[], games=[], loaded={p:false,g:false}, schedule={}, actas={}, assetsApi=null, downloadsApi=null;
const FEB_URL=id=>"https://www.feb.es/competiciones/Partido.aspx?p="+id;
let mcpApi=null, liveDocs={}, profiles={};
const POSITIONS=["Base","Escolta","Alero","Ala-pívot","Pívot"];
const COMP={"L.F.-2":"Liga Femenina 2","LF CHALLENGE":"LF Challenge","LF ENDESA":"Liga Femenina Endesa","LIGA EBA":"Liga EBA","SEGUNDA FEB":"Segunda FEB","TERCERA FEB":"Tercera FEB"};
const tcase=t=>String(t||"").toLowerCase().replace(/(^|[\s.\-\/("'])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase()).replace(/(?<=\s)(De|Del|La|Las|Los|El|Y|E)\b/g,w=>w.toLowerCase()).replace(/\b(Cb|Cd|Ud|Ue|Bc|Cbf|Adba|Ull|Gdko|Spar|Tgn|Gmasb|Uema|Clvdg|Ad|Cf|Sd|Ep|Ce|Sl)\b/gi,w=>w.toUpperCase());
const ui = { team: TEAMS.A[0], pGroup:"all", pTeam:"all", sort:"pts", minG:1, mode:"avg", gGroup:"all", editing:null, form:null, confirmDel:null, rosterTeam: TEAMS.A[0] };

const $ = s=>document.querySelector(s);
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const n = v=>{const x=Number(v);return Number.isFinite(x)?x:0};
const f1 = v=>(Math.round(v*10)/10).toFixed(1);
const pct = (m,a)=>a?(100*m/a).toFixed(1)+"%":"–";
const pc = (m,a)=>a?Math.round(100*m/a)+"%":"–";
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2600)}

/* ---------- cálculos ---------- */
function line(b){
  const x={}; FIELDS.forEach(k=>x[k]=n(b?.[k]));
  x.pts=b&&b.pts!=null&&b.pts!==""?n(b.pts):2*x.t2m+3*x.t3m+x.tlm; x.reb=x.ro+x.rd;
  x.val=b&&b.va!=null&&b.va!==""?n(b.va):x.pts+x.reb+x.ast+x.rob+x.tap+x.fr-(x.t2a-x.t2m)-(x.t3a-x.t3m)-(x.tla-x.tlm)-x.per-x.fc;
  return x;
}
function played(b){return b && FIELDS.some(k=>n(b[k])>0)}
function sideBox(g,side){return (g.box&&g.box[side])||{}}
function standings(group){
  const rows={}; TEAMS[group].forEach(t=>rows[t]={team:t,pj:0,w:0,l:0,pf:0,pc:0});
  games.filter(g=>g.group===group).forEach(g=>{
    const h=rows[g.home],a=rows[g.away]; if(!h||!a)return;
    const hs=n(g.hs),as=n(g.as); if(hs===as) return;
    h.pj++;a.pj++;h.pf+=hs;h.pc+=as;a.pf+=as;a.pc+=hs;
    if(hs>as){h.w++;a.l++}else{a.w++;h.l++}
  });
  return Object.values(rows).map(r=>({...r,pts:2*r.w+r.l,dif:r.pf-r.pc}))
    .sort((x,y)=>y.pts-x.pts||y.w-x.w||y.dif-x.dif||y.pf-x.pf||x.team.localeCompare(y.team));
}
function playerTotals(){
  const map={};
  players.forEach(p=>map[p.id]={...p,gp:0,tot:line({})});
  [...games].sort(byDate).forEach(g=>["home","away"].forEach(side=>{
    const box=sideBox(g,side);
    for(const pid in box){ if(!map[pid]||!played(box[pid]))continue;
      if(box[pid].d!=null&&box[pid].d!=="") map[pid].dorsal=box[pid].d;
      const L=line(box[pid]),T=map[pid].tot; map[pid].gp++;
      for(const k in L) T[k]+=L[k];
    }
  }));
  return Object.values(map);
}
function teamTotals(team){
  const t={gp:0,w:0,l:0,pf:0,pc:0,box:line({}),boxGames:0};
  games.forEach(g=>{
    const side=g.home===team?"home":g.away===team?"away":null; if(!side)return;
    const own=side==="home"?n(g.hs):n(g.as), opp=side==="home"?n(g.as):n(g.hs);
    t.gp++; t.pf+=own; t.pc+=opp; own>opp?t.w++:t.l++;
    const box=sideBox(g,side); const ids=Object.keys(box).filter(id=>played(box[id]));
    if(ids.length){t.boxGames++; ids.forEach(id=>{const L=line(box[id]); for(const k in L)t.box[k]+=L[k]})}
  });
  return t;
}

function schedAll(){return ["A","B"].flatMap(g=>(schedule[g]?.games||[]).map(e=>({...e,group:g})))}
function gameFor(e){return games.find(x=>x.febId===e.id)||null}
function matchState(e){
  const g=gameFor(e);
  if(g) return {kind:"final",hs:n(g.hs),as:n(g.as),g};
  if(e.status==="final") return {kind:"final",hs:n(e.hs),as:n(e.as)};
  const L=sessions[e.id]?.data?{...sessions[e.id].data,at:sessions[e.id].last}:liveDocs[e.id];
  if(L&&Date.now()-n(L.at)<(L.source==="programado"?75:10)*60e3) return L.status==="FINAL"?{kind:"final",hs:n(L.hs),as:n(L.as),live:L}:{kind:"live",hs:n(L.hs),as:n(L.as),live:L};
  if(!e.date) return {kind:"tbd"};
  const start=new Date(`${e.date}T${e.time||"12:00"}:00`), now=Date.now();
  if(e.time && now>=start-10*60e3 && now<=start.getTime()+135*60e3) return {kind:"live",start};
  if(e.time && now>start.getTime()+135*60e3) return {kind:"pending",start};
  return {kind:"upcoming",start};
}
const fmtDate=(d,opt={weekday:"short",day:"numeric",month:"short"})=>d?new Date(d+"T12:00").toLocaleDateString("es-ES",opt):"";
function currentJornada(){
  const today=new Date().toISOString().slice(0,10), jd=schedule.A?.jornadaDates||[];
  for(let j=1;j<=26;j++){const es=schedAll().filter(e=>e.j===j); if(es.some(e=>!["final"].includes(matchState(e).kind)) && (jd[j-1]||"")>=new Date(Date.now()-3*864e5).toISOString().slice(0,10)) return j}
  return 26;
}
function matchCard(e){
  const st=matchState(e), nActas=(actas[e.id]?.files||[]).length;
  const chip={final:`<span class="chip final">Final</span>`,live:`<span class="chip live"><span class="dot"></span>En juego${st.live?" · "+esc(st.live.status):""}</span>`,pending:`<span class="chip">Pendiente de resultado</span>`,upcoming:`<span class="chip">Próximo</span>`,tbd:`<span class="chip">Fecha por determinar</span>`}[st.kind];
  const fin=st.kind==="final"||(st.kind==="live"&&st.live), hw=fin&&st.hs>st.as, aw=fin&&st.as>st.hs;
  return `<article class="match${st.kind==="live"?" live":""}">
    <div class="top"><span>${e.date?esc(fmtDate(e.date)):"Sin fecha"}${e.time&&!fin?" · "+esc(e.time):""}</span>${chip}</div>

}

function sortVal(p,k){
  const T=p.tot, d=ui.mode==="avg"&&p.gp?p.gp:1;
  if(k==="gp")return p.gp;
  if(k==="t2p")return T.t2a?T.t2m/T.t2a:-1;
  if(k==="t3p")return T.t3a?T.t3m/T.t3a:-1;
  if(k==="tlp")return T.tla?T.tlm/T.tla:-1;
  return (T[k]||0)/d;
}
function playerTable(list,sortable){
  const avg=ui.mode==="avg"||!sortable, cols=[["gp","PJ"],["min","MIN"],["pts","PTS"],["reb","REB"],["ast","AST"],["fc","FC"],["fr","FR"],["rob","ROB"],["tap","TAP"],["per","PER"],["t2p","T2%"],["t3p","T3%"],["tlp","TL%"],["val","VAL"]];

  ${list.map((p,i)=>{const T=p.tot,d=avg&&p.gp?p.gp:1,v=k=>avg?f1(T[k]/d):T[k];
    return `<tr>${sortable?`<td class="pos">${i+1}</td>`:""}<td class="l">${p.dorsal!==""&&p.dorsal!=null?`<span class="muted">${esc(p.dorsal)}</span> `:""}<button class="link pl" data-player="${esc(p.id)}">${esc(p.name)}</button></td>${sortable?`<td class="l">${esc(p.team)}</td>`:""}
    <td>${p.gp}</td><td>${p.gp?v("min"):"–"}</td><td><b>${p.gp?v("pts"):"–"}</b></td><td>${p.gp?v("reb"):"–"}</td><td>${p.gp?v("ast"):"–"}</td><td>${p.gp?v("fc"):"–"}</td><td>${p.gp?v("fr"):"–"}</td><td>${p.gp?v("rob"):"–"}</td><td>${p.gp?v("tap"):"–"}</td><td>${p.gp?v("per"):"–"}</td>
    <td>${pct(T.t2m,T.t2a)}</td><td>${pct(T.t3m,T.t3a)}</td><td>${pct(T.tlm,T.tla)}</td><td><b>${p.gp?v("val"):"–"}</b></td></tr>`}).join("")}

}

    doc.careerManual=cm;t.disabled=true;try{await db.doc("players/"+p.id).set(doc);ui.editCar=null;toast(t.dataset.savecar?`Temporada ${sn} guardada`:`Temporada ${sn} restablecida`);render()}catch(err){t.disabled=false;toast("No se pudo guardar: "+err.message)}return}
  if(t.dataset.match){ui.match=t.dataset.match;ui.openPdf=null;go("partido");return}
  if(t.dataset.openacta){const fid=t.dataset.openacta,pdf=(actas[fid]?.files||[]).find(f=>f.type==="application/pdf");ui.match=fid;ui.openPdf=pdf?pdf.id:null;go("partido");setTimeout(()=>document.querySelector(".pdfview")?.scrollIntoView({behavior:"smooth",block:"start"}),80);return}
  if(t.dataset.jstep){ui.jornada=Math.min(26,Math.max(1,(ui.jornada||1)+Number(t.dataset.jstep)));render();return}
  if(t.hasAttribute("data-gojor")){if(t.dataset.gojor)ui.jornada=Number(t.dataset.gojor);go("jornadas");return}
  if(t.dataset.pdf!=null){const f=actas[ui.match].files[t.dataset.pdf];ui.openPdf=ui.openPdf===f.id?null:f.id;render();return}
  if(t.dataset.dl!=null){const f=actas[ui.match].files[t.dataset.dl];try{const blob=await fetch(fileUrl(f)).then(r=>{if(!r.ok)throw new Error("no disponible");return r.blob()});await downloadsApi.save({filename:f.name,data:blob})}catch(err){if(err?.code!=="cancelled")toast("No se pudo descargar: "+(err.message||err.code))}return}
  if(t.dataset.askrm){ui.confirmFile=t.dataset.askrm;render();return}
  if(t.dataset.startlive){startLive(t.dataset.startlive);return}
  if(t.dataset.stoplive){await stopLive(t.dataset.stoplive);render();return}
  if(t.dataset.savelive){t.disabled=true;await saveLive(t.dataset.savelive);return}
  if(t.dataset.autolive){const v=t.dataset.autolive; autoLive=v!=="off"; autoBlocked=null; try{localStorage.setItem("lf2-autolive",autoLive?"on":"off")}catch(e){} if(autoLive)autoTick(); render(); return}
  if(t.hasAttribute("data-cancelfile")){ui.confirmFile=null;render();return}
  if(t.dataset.rmfile!=null){const fid=ui.match,files=[...actas[fid].files],[f]=files.splice(Number(t.dataset.rmfile),1);ui.confirmFile=null;
    try{await db.doc("actas/"+fid).set({files});actas[fid]={files};try{await assetsApi.delete(f.id)}catch(e){}toast("Acta quitada");render()}catch(err){toast("No se pudo quitar: "+err.message)}return}
  if(t.hasAttribute("data-back")){go("jugadoras");return}
  if(t.dataset.sort){ui.sort=t.dataset.sort;render();return}
  if(t.id==="newGame"){ui.form=blankForm();render();return}
  if(t.id==="askWipe"){ui.confirmDemo=true;render();return}
  if(t.hasAttribute("data-cancel-demo")){ui.confirmDemo=false;render();return}
  if(t.id==="wipeDemo"){ui.confirmDemo=false;t.disabled=true;let c=0;
    try{for(const g of games.filter(x=>x.demo)){await db.doc("games/"+g.id).delete();c++}
      for(const p of players.filter(x=>x.demo)){await db.doc("players/"+p.id).delete();c++}
      toast(`${c} registros de ejemplo borrados`)}catch(err){toast("No se pudieron borrar todos: "+err.message)}return}
  if(t.dataset.edit){const g=games.find(x=>x.id===t.dataset.edit);ui.form=JSON.parse(JSON.stringify({...g,hs:String(g.hs),as:String(g.as),box:{home:g.box?.home||{},away:g.box?.away||{}}}));if(curView!=="partidos")curView="partidos";render();window.scrollTo(0,0);return}
  if(t.hasAttribute("data-cancel-form")){ui.form=null;render();return}
  if(t.dataset.askDel){ui.confirmDel=t.dataset.askDel;render();return}
  if(t.hasAttribute("data-cancel")){ui.confirmDel=null;render();return}
  if(t.dataset.del){const [kind,id]=t.dataset.del.split(":");ui.confirmDel=null;
    try{await db.doc((kind==="game"?"games/":"players/")+id).delete();toast(kind==="game"?"Partido borrado":"Jugadora borrada")}catch(err){toast("No se pudo borrar: "+err.message)}return}
  if(t.id==="saveGame"){await saveGame();return}
});
document.addEventListener("dragover",e=>{const d=e.target.closest&&e.target.closest("#dropActa");if(d){e.preventDefault();d.classList.add("over")}});
document.addEventListener("dragleave",e=>{const d=e.target.closest&&e.target.closest("#dropActa");if(d)d.classList.remove("over")});
document.addEventListener("drop",e=>{const d=e.target.closest&&e.target.closest("#dropActa");if(d){e.preventDefault();d.classList.remove("over");uploadActas([...e.dataTransfer.files])}});
document.addEventListener("submit",async e=>{
  e.preventDefault(); const f=e.target;
  if(f.id==="addPlayer"){
    const name=$("#apName").value.trim(); if(!name)return;
    await addPlayer({name,dorsal:$("#apDorsal").value,pos:$("#apPos").value,team:ui.rosterTeam});
  } else if(f.dataset.quickadd){
    readForm(); const s=f.dataset.quickadd, name=document.getElementById("qa-n-"+s).value.trim(); if(!name)return;
    await addPlayer({name,dorsal:document.getElementById("qa-d-"+s).value,pos:"",team:ui.form[s]});
  }
});
async function addPlayer(p){
  try{await db.collection("players").add({name:p.name,dorsal:p.dorsal===""?"":n(p.dorsal),pos:p.pos,team:p.team,created:Date.now()});toast(`${p.name} añadida a ${p.team}`)}
  catch(err){toast("No se pudo guardar la jugadora: "+err.message)}
}
async function saveGame(){
  readForm(); const F=ui.form;
  if(F.home===F.away){toast("Local y visitante tienen que ser equipos distintos");return}
  if(F.hs===""||F.as===""){toast("Falta el marcador de alguno de los dos equipos");return}
  if(n(F.hs)===n(F.as)){toast("En baloncesto no hay empates: revisa el marcador");return}
  const clean=b=>{const o={};for(const pid in b){if(!played(b[pid]))continue;o[pid]={};FIELDS.forEach(k=>{if(n(b[pid][k]))o[pid][k]=n(b[pid][k])});["d","pts","va"].forEach(k=>{if(b[pid][k]!=null&&b[pid][k]!=="")o[pid][k]=b[pid][k]})}return o};
  const doc={group:F.group,jornada:n(F.jornada)||"",date:F.date||"",home:F.home,away:F.away,hs:n(F.hs),as:n(F.as),box:{home:clean(F.box.home),away:clean(F.box.away)},updated:Date.now()};
  const btn=$("#saveGame"); btn.disabled=true;
  try{ if(F.id) await db.doc("games/"+F.id).set(doc); else await db.collection("games").add(doc);
    toast(F.id?"Partido actualizado":"Partido guardado"); ui.form=null; render();
  }catch(err){btn.disabled=false;toast("No se pudo guardar: "+err.message)}
}

/* ---------- versión pública (Vercel): datos estáticos de data/bundle.json ---------- */
let staticInfo=null;
async function loadBundle(){
  const r=await fetch("data/bundle.json?t="+Date.now(),{cache:"no-store"}); if(!r.ok) throw new Error("HTTP "+r.status);
  const b=await r.json();
  players=b.players||[]; games=b.games||[]; schedule=b.schedule||{}; actas=b.actas||{}; liveDocs=b.live||{};
  if(!Object.keys(profiles).length){try{const q=await fetch("data/profiles.json",{cache:"no-store"}); if(q.ok) profiles=(await q.json()).byId||{}}catch(e){}}
  staticInfo={generated:b.generated}; loaded.p=loaded.g=true; db=db||{static:true}; render();
}
async function staticMode(){
  canWrite=false; const reg=document.querySelector('#tabs a[data-v="partidos"]'); if(reg) reg.hidden=true; if(curView==="partidos") curView="clasificacion";
  try{await loadBundle(); setInterval(()=>{if(!document.querySelector(".pdfview")&&!lb)loadBundle().catch(()=>{})},120000)}
  catch(e){loaded.fail=true;render()}
}
const fileUrl=f=>f.url||("/_blob/"+f.id);
render();
(async()=>{
  const cl=window.claude; if(!cl||!cl.use){await staticMode();return}
  db=await cl.use("db");
  if(!db){await staticMode();return}
  const user=await cl.use("user");
  const cw=user?await user.can("data.write"):null; canWrite=cw!==false;
  const err=e=>{toast("Error de datos: "+e.message)};
  db.collection("players").onSnapshot(s=>{players=s.docs.map(d=>({id:d.id,...d.data()}));loaded.p=true;if(!(ui.form&&document.activeElement&&document.activeElement.dataset.side))render()},err);
  db.collection("profiles").onSnapshot(s=>{const d=s.docs.find(x=>x.id==="all");profiles=d?(d.data().byId||{}):{};if(curView==="jugadora")render()},()=>{});
  db.collection("games").onSnapshot(s=>{games=s.docs.map(d=>({id:d.id,...d.data()}));loaded.g=true;if(!ui.form)render()},err);
  db.collection("schedule").onSnapshot(s=>{schedule={};s.docs.forEach(d=>schedule[d.id]=d.data());if(!ui.form)render();if(mcpApi&&canWrite&&autoTimer)autoTick()},err);
  db.collection("actas").onSnapshot(s=>{actas={};s.docs.forEach(d=>actas[d.id]=d.data());if(!ui.form)render()},err);
  cl.use("assets").then(a=>{assetsApi=a;if(curView==="partido")render()});
  cl.use("mcp").then(m=>{mcpApi=m;render();if(m&&canWrite)startAuto()});
  db.collection("live").onSnapshot(s=>{liveDocs={};s.docs.forEach(d=>liveDocs[d.id]=d.data());if(!ui.form&&["jornadas","partido","calendario"].includes(curView))render()},err);
  cl.use("downloads").then(d=>{downloadsApi=d;if(curView==="partido")render()});
  setInterval(()=>{if(["jornadas","calendario","partido"].includes(curView)&&!document.querySelector(".pdfview"))render()},60000);
  render();
})();
</script>
